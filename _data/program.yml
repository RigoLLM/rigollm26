- time: "9:00–10:00"
  kind: keynote
  title: "Keynote I"
  speaker: "Hong Xu"
  speaker_affil: "Associate Professor, The Chinese University of Hong Kong"
  talk_title: "Beyond Performance Engineering for AI Systems Research"
  abstract: |
    As LLMs have taken off, AI systems have also undergone explosive development recently. As systems researchers, we chase new optimization techniques every day at different levels—hardware, operators, compilers, collective communication, parallel paradigms, frameworks, context, KV cache, agents, and algorithm–system co-design. Yet while waiting for your favorite TUI/harness to complete the tasks, we've surely asked ourselves this: besides pushing performance (or cost) to the limit, is there anything else exciting and meaningful?

    Of course yes—plenty! In this talk, I will share two important and fascinating directions, along with our recent work on them. (1) Reliability: whether in training or inference, a single failure interrupts the most efficient system. In the context of large-scale AI systems, how can we quickly pinpoint the location of a failure? Can we leverage large models and agents to enable autonomous operation and maintenance of AI infrastructure? (2) System simulation: AI systems are already extraordinarily complex, where a change in one component affects the whole. In practice, though, we often need to quickly, cheaply, and accurately determine how a given optimization would affect performance and cost under different models or cluster configurations—or find the optimal deployment plan under given resource constraints. How can we build a simulator to answer these questions? What other benefits and use cases can system simulation bring?
  bio: |
    Hong Xu is an Associate Professor in the Department of Computer Science and Engineering, The Chinese University of Hong Kong. His research area is computer networking and systems, particularly machine learning systems and data center networks. His work has received best paper awards from ACM SIGCOMM 2022, IEEE ICNP 2023 and 2015, and the community award from USENIX NSDI 2026. He has also received multiple collaborative research awards from industry and distinguished reviewer/editor awards from the community. He is a senior member of ACM and IEEE, and an associate editor of ACM TOCS and IEEE TNSE.

