- time: "13:30–14:30"
  kind: keynote
  title: "Keynote II"
  speaker: "Haibo Chen"
  speaker_affil: "Distinguished Professor, Shanghai Jiao Tong University"
  talk_title: "From Probabilistic Models to System-Level Determinism: Model-Native Operating Systems for the AI Era"
  abstract: |
    AI models are probabilistic by nature, yet industry asks them to complete real tasks — a gap bridged today by heuristics and trust in opaque components. This talk presents an operating-systems answer: don't eliminate probability, converge it into system-level determinism. Like the "underwater iceberg" beneath every computing paradigm, a model-native OS makes LLMs and agents checkable, auditable, and trustworthy by design.

    The talk reframes OS design as a shift from reductionism to systems theory — probabilistic planning, constrained execution, verifiable convergence — with the abstraction layer evolving from syscall to intent-call. I will show this working at scale: formal reasoning generalized to natural-language specifications over hundred-thousand-line codebases, specification-driven development replacing vibe coding with verified implementations, agent-native interfaces that cut failure rates from near-total to a fifth, and record-and-replay techniques that turn probabilistic reasoning into deterministic reuse. A second, briefer thread covers the cost side of intelligence yield: how the OS, as the hub of software and hardware, delivers efficient edge-cloud intelligence, from device-native models to millisecond-level agent state management. Together, these sketch a "four-dimensional native" OS for the intelligent world — rigor not as an afterthought, but as a system abstraction.
  bio: |
    Haibo Chen is a Distinguished Professor at Shanghai Jiao Tong University, where he founded and directs the Institute of Parallel and Distributed Systems (IPADS). His main research areas include operating systems, distributed systems, machine learning systems, and AI for Science. He has published extensively in top-tier conferences and journals, including Nature, SOSP, OSDI, ISCA, ASPLOS, FAST, EuroSys, and ATC. His work has been recognized with numerous accolades, including Best Paper Awards at SOSP, ASPLOS, EuroSys, and FAST; a Test of Time Award from DSN; a Best Paper Honorable Mention and Research Highlight Award from SIGMOD; a Research Highlight from Communications of the ACM (CACM); and an Honorable Mention for the ACM SIGOPS Dennis M. Ritchie Thesis Award (as Advisor).

    He currently serves as an Editorial Board Member for CACM Research and Advances, co-chairs the CACM Regional Special Sections, and is the General Co-Chair for ASPLOS 2028. He is also the founding Chair of the Technical Steering Committee for OpenHarmony, an open-source operating system deployed on hundreds of millions of devices. Prof. Chen is an ACM Fellow and an IEEE Fellow, and currently chairs ACM SIGOPS.

